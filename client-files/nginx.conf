# Serves an installed game client in the patch-server layout Imlight reads: /V_<revision>/<path in the client>.
server {
    listen 12369;
    server_tokens off;
    autoindex off;
    # Bind mounts from a Windows drive don't support sendfile reliably.
    sendfile off;

    location = /healthz {
        access_log off;
        return 204;
    }

    location ~ ^/(V_[^/]+)/(LatestFileList\.(?:xml|bin))$ {
        alias /lists/$1/$2;
    }

    # The client's own Root.wad may carry the admin panel; serve the untouched original when it exists.
    location ~ ^/V_[^/]+/Data/GameData/Root\.wad$ {
        root /client;
        try_files /Data/Root.wad.adminpanel-original /Data/GameData/Root.wad =404;
    }

    location ~ ^/V_[^/]+/(.+)$ {
        root /client;
        try_files /$1 =404;
    }

    location / {
        return 404;
    }
}
